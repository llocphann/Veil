name: Run Wallhaven hardening

on:
  push:
    branches: [prerelease]
    paths:
      - ".github/workflows/run-wallhaven-hardening.yml"

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Apply patch
        run: python .github/harden-wallhaven.py

      - name: Install
        run: npm ci

      - name: Clean lint
        run: npm run lint -- --max-warnings=0

      - name: Full check
        run: npm run check

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/harden-wallhaven.py .github/workflows/run-wallhaven-hardening.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Wallhaven imports"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:prerelease

# Retry after aligning the staged patch with the current changelog.
