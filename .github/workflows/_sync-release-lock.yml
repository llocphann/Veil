name: Sync Veil release lockfile

on:
  push:
    branches:
      - prerelease

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out prerelease
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: prerelease
          persist-credentials: true

      - name: Synchronize package-lock release version
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.5.0 --no-git-tag-version --allow-same-version
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git diff -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync 1.5.0 release lockfile"
          git push origin HEAD:prerelease
