name: Veil 1.7.0 performance gate

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/dev-perf-gate-1.7.0.yml

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VEIL_PERF_BASELINE: 1.6.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch stable baseline and tags
        run: git fetch origin stable:refs/remotes/origin/stable --tags --force

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run performance gate
        run: |
          set -o pipefail
          npm run perf 2>&1 | tee veil-perf.log

      - name: Upload performance log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-perf-1.7.0-${{ github.sha }}
          path: veil-perf.log
          if-no-files-found: error
          retention-days: 7
