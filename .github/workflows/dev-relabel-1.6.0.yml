name: Relabel Veil candidate to 1.6.0

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/dev-relabel-1.6.0.yml"

permissions:
  contents: write

jobs:
  relabel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Relabel candidate metadata
        run: |
          npm version 1.6.0 --no-git-tag-version --ignore-scripts
          node version-bump.mjs
          node -e "const fs=require('fs'); const p='versions.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); delete v['2.0.0']; v['1.6.0']='1.13.7'; fs.writeFileSync(p, JSON.stringify(v,null,2)+'\\n');"
          sed -i '0,/^## 2\.0\.0$/s//## 1.6.0/' CHANGELOG.md
          sed -i 's/Veil 2\.0 stability contract/Veil 1.6 stability contract/g' CHANGELOG.md
          sed -i 's/2\.0 invariant/1.6 invariant/g' tests/stability-contract.test.ts
          git rm .github/workflows/dev-scan-version-labels.yml

      - name: Commit relabeled candidate to dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add package.json package-lock.json manifest.json versions.json CHANGELOG.md tests/stability-contract.test.ts
          git commit -m "chore: relabel Veil candidate as 1.6.0"
          git push origin HEAD:dev
