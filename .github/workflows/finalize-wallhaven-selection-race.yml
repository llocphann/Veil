name: Finalize Wallhaven selection race

on:
  push:
    branches:
      - prerelease
    paths:
      - ".github/workflows/finalize-wallhaven-selection-race.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply guarded selection patch
        run: python tools/finalize-wallhaven-selection-race.py

      - name: Install dependencies
        run: npm ci

      - name: Verify zero-warning lint
        run: npm run lint -- --max-warnings=0

      - name: Verify full prerelease
        run: npm run check

      - name: Commit verified race fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/workflows/finalize-wallhaven-selection-race.yml
          rm tools/finalize-wallhaven-selection-race.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wallpaper-library-modal.ts tests/wallhaven-library.test.ts .github/workflows/finalize-wallhaven-selection-race.yml tools/finalize-wallhaven-selection-race.py
          git commit -m "fix: preserve newer wallpaper choices during import"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:prerelease
