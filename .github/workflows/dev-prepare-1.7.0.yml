name: Prepare Veil 1.7.0 metadata

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/dev-prepare-1.7.0.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Generate 1.7.0 release metadata
        run: |
          npm version 1.7.0 --no-git-tag-version --ignore-scripts --allow-same-version
          node version-bump.mjs

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git diff --cached --exit-code && exit 0
          git commit -m "chore: prepare 1.7.0 release metadata"
          git push origin HEAD:dev
