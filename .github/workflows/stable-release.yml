name: Promote stable release

on:
  push:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out stable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: stable
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify promoted source
        run: npm run check

  version:
    if: github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out stable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: stable
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Increment patch version
        run: |
          npm version patch --no-git-tag-version --ignore-scripts
          node version-bump.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = pkg.version;
          const path = 'CHANGELOG.md';
          let changelog = fs.readFileSync(path, 'utf8');
          const heading = `## ${version}`;
          if (!changelog.includes(heading)) {
            const marker = '## Unreleased';
            const entry = `${marker}\n\n${heading}\n\n- Promote the verified development state to the stable release channel.`;
            if (!changelog.includes(marker)) throw new Error('CHANGELOG.md is missing the Unreleased section.');
            changelog = changelog.replace(marker, entry);
            fs.writeFileSync(path, changelog);
          }
          NODE

      - name: Verify synchronized release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (manifest.version !== pkg.version) throw new Error('manifest/package version mismatch');
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('lockfile version mismatch');
          if (versions[pkg.version] !== manifest.minAppVersion) throw new Error('versions.json is missing the release');
          if (!changelog.includes(`## ${pkg.version}`)) throw new Error('CHANGELOG.md is missing the release');
          NODE

      - name: Commit version and create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json CHANGELOG.md
          git commit -m "chore: release ${VERSION}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:stable
          git tag "${VERSION}"
          git push origin "${VERSION}"
