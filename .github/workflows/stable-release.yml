name: Promote stable release

on:
  push:
    branches:
      - stable
    paths-ignore:
      - README.md
      - "wiki/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify prerelease promotion source
        run: |
          git fetch --no-tags origin prerelease:refs/remotes/origin/prerelease
          PRERELEASE_SHA=$(git rev-parse origin/prerelease)
          PRERELEASE_TREE=$(git rev-parse "${PRERELEASE_SHA}^{tree}")
          STABLE_TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")

          git merge-base --is-ancestor "${PRERELEASE_SHA}" "${GITHUB_SHA}" || {
            echo "Stable releases must be promoted from prerelease." >&2
            exit 1
          }

          if [ "${PRERELEASE_TREE}" != "${STABLE_TREE}" ]; then
            echo "Stable source must exactly match the smoke-tested prerelease tree." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify promoted source
        run: npm run check

      - name: Upload verified runtime files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-stable-runtime-${{ github.sha }}
          path: |
            main.js
            styles.css
          if-no-files-found: error
          retention-days: 1

  version:
    if: github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Prepare release version and tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          mapfile -t PUBLISHED_VERSIONS < <(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName'
          )
          LATEST_PUBLISHED=$(node release-version.mjs --latest "${PUBLISHED_VERSIONS[@]}")
          VERSION=$(node release-version.mjs "${CURRENT_VERSION}" "${LATEST_PUBLISHED}")
          HAS_TAG=false
          HAS_RELEASE=false

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            HAS_TAG=true
            if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              HAS_RELEASE=true
            fi
          fi

          if [ "${VERSION}" != "${CURRENT_VERSION}" ]; then
            npm version "${VERSION}" --no-git-tag-version --ignore-scripts
            node version-bump.mjs
            node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = pkg.version;
          const path = 'CHANGELOG.md';
          let changelog = fs.readFileSync(path, 'utf8');
          const heading = `## ${version}`;
          if (!changelog.includes(heading)) {
            const marker = '## Unreleased';
            const entry = `${marker}\n\n${heading}\n\n- Promote the smoke-tested prerelease state to the stable release channel.`;
            if (!changelog.includes(marker)) throw new Error('CHANGELOG.md is missing the Unreleased section.');
            changelog = changelog.replace(marker, entry);
            fs.writeFileSync(path, changelog);
          }
          NODE
            MODE=bump
          elif [ "${HAS_TAG}" = true ] && [ "${HAS_RELEASE}" = false ]; then
            MODE=recover
          elif [ "${HAS_RELEASE}" = true ]; then
            echo "Computed release ${VERSION} is already published; refusing to republish it." >&2
            exit 1
          else
            MODE=current
          fi

          echo "current=${CURRENT_VERSION}"
          echo "latest_published=${LATEST_PUBLISHED:-none}"
          echo "version=${VERSION}"
          echo "mode=${MODE}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"

      - name: Verify synchronized release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (manifest.version !== pkg.version) throw new Error('manifest/package version mismatch');
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('lockfile version mismatch');
          if (versions[pkg.version] !== manifest.minAppVersion) throw new Error('versions.json is missing the release');
          if (!changelog.includes(`## ${pkg.version}`)) throw new Error('CHANGELOG.md is missing the release');
          NODE

      - name: Commit release metadata and create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ "${RELEASE_MODE}" = bump ]; then
            git add package.json package-lock.json manifest.json versions.json CHANGELOG.md
            git commit -m "chore: release ${VERSION}"
            git push origin HEAD:stable
            git tag "${VERSION}"
            git push origin "${VERSION}"
          elif [ "${RELEASE_MODE}" = current ]; then
            git tag "${VERSION}"
            git push origin "${VERSION}"
          else
            echo "Tag ${VERSION} already exists without a published release; reusing it."
          fi

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-stable-manifest-${{ github.run_id }}
          path: manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.actor != 'github-actions[bot]'
    needs:
      - verify
      - version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified runtime files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: veil-stable-runtime-${{ github.sha }}
          path: release

      - name: Download release manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: veil-stable-manifest-${{ github.run_id }}
          path: release

      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; nothing to publish."
            exit 0
          fi
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Veil ${VERSION}" \
            --generate-notes \
            release/main.js release/manifest.json release/styles.css
