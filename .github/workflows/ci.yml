name: Verify Veil

on:
  push:
    branches:
      - main
      - prerelease
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build
        run: npm run check

      - name: Upload prerelease smoke-test bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/prerelease'
        uses: actions/upload-artifact@v4
        with:
          name: veil-prerelease-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 7
