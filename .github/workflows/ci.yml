name: Verify Veil

on:
  push:
    branches:
      - dev
      - prerelease
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build
        run: |
          set -o pipefail
          npm run check 2>&1 | tee veil-check.log

      - name: Upload verification log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-check-log-${{ github.sha }}
          path: veil-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Upload prerelease smoke-test bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/prerelease'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-smoke-prerelease-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 7
