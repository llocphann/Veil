name: Sync Veil main into prerelease

on:
  push:
    branches:
      - prerelease
    paths:
      - ".github/workflows/sync-main-into-prerelease.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out prerelease
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Merge current main and update docs contract
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/sync-main-into-prerelease.yml
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/manifest.test.ts")
          source = path.read_text()
          old = '''void test("context routing and opacity exclusions are documented and exposed in settings", () => {\n  const readme = fs.readFileSync("README.md", "utf8");\n  const settings = settingsSource();\n  const runtime = fs.readFileSync("src/main.ts", "utf8");\n\n  assert.match(readme, /Wallpaper routes are evaluated from top to bottom/);\n  assert.match(readme, /Opacity exclusions are additive/);\n  assert.match(settings, /heading: "Wallpaper routing"/);\n  assert.match(settings, /heading: "Opacity exclusions"/);\n  assert.match(runtime, /metadataCache\\.on\\(\\"changed\\"/);\n});'''
          new = '''void test("context routing and opacity exclusions are documented and exposed in settings", () => {\n  const readme = fs.readFileSync("README.md", "utf8");\n  const routingGuide = fs.readFileSync("wiki/Routing-and-Opacity-Exclusions.md", "utf8");\n  const settings = settingsSource();\n  const runtime = fs.readFileSync("src/main.ts", "utf8");\n\n  assert.match(readme, /Routing and Opacity Exclusions/);\n  assert.match(routingGuide, /Ordinary wallpaper rules/);\n  assert.match(routingGuide, /Adaptive system fallbacks/);\n  assert.match(routingGuide, /Exclusions are additive/);\n  assert.match(settings, /heading: "Wallpaper routing"/);\n  assert.match(settings, /heading: "Opacity exclusions"/);\n  assert.match(runtime, /metadataCache\\.on\\(\\"changed\\"/);\n});'''
          if source.count(old) != 1:
              raise SystemExit("Expected one stale routing documentation contract")
          path.write_text(source.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify merged tree
        run: npm run check

      - name: Commit and push merged prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --check
          git add -A
          git commit -m "chore: sync main documentation into prerelease"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:prerelease
