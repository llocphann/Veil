name: Scan Veil version labels

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/dev-scan-version-labels.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          persist-credentials: false
      - name: List Veil 2.0 labels
        run: |
          git grep -n -E '2\.0(\.0)?' -- ':!package-lock.json' || true
