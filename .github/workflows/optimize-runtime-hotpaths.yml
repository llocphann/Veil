name: Optimize Veil runtime hot paths

on:
  push:
    branches:
      - prerelease
    paths:
      - ".github/workflows/optimize-runtime-hotpaths.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Patch runtime hot paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.ts")
          source = path.read_text()

          replacements = [
              (
                  'import { shouldInvalidatePoolCandidates } from "./pool-cache-invalidation";',
                  'import { invalidatePoolCandidatesForVaultEvent } from "./pool-cache-invalidation";',
              ),
              (
                  '''      this.app.metadataCache.on("changed", (file) => {\n        if (this.isActiveFile(file)) this.refreshWallpaper();\n      }),''',
                  '''      this.app.metadataCache.on("changed", (file) => {\n        if (!this.layoutReady) return;\n        if (this.isActiveFile(file)) this.refreshWallpaper();\n      }),''',
              ),
              (
                  '''      this.app.vault.on("create", (file) => {\n        if (shouldInvalidatePoolCandidates("create", file.path, "", !(file instanceof TFile))) {\n          this.poolCandidates.clear();\n        }\n        this.refreshIfWallpaper(file.path);\n      }),''',
                  '''      this.app.vault.on("create", (file) => {\n        invalidatePoolCandidatesForVaultEvent(\n          this.poolCandidates,\n          "create",\n          file.path,\n          "",\n          !(file instanceof TFile),\n        );\n        this.refreshIfWallpaper(file.path);\n      }),''',
              ),
              (
                  '''      this.app.vault.on("delete", (file) => {\n        if (shouldInvalidatePoolCandidates("delete", file.path, "", !(file instanceof TFile))) {\n          this.poolCandidates.clear();\n        }\n        this.pruneWallpaperLibrary(file.path);\n        this.refreshIfWallpaper(file.path);\n      }),''',
                  '''      this.app.vault.on("delete", (file) => {\n        invalidatePoolCandidatesForVaultEvent(\n          this.poolCandidates,\n          "delete",\n          file.path,\n          "",\n          !(file instanceof TFile),\n        );\n        this.pruneWallpaperLibrary(file.path);\n        this.refreshIfWallpaper(file.path);\n      }),''',
              ),
              (
                  '''      this.app.vault.on("rename", (file, oldPath) => {\n        if (shouldInvalidatePoolCandidates("rename", file.path, oldPath, !(file instanceof TFile))) {\n          this.poolCandidates.clear();\n        }''',
                  '''      this.app.vault.on("rename", (file, oldPath) => {\n        invalidatePoolCandidatesForVaultEvent(\n          this.poolCandidates,\n          "rename",\n          file.path,\n          oldPath,\n          !(file instanceof TFile),\n        );''',
              ),
              (
                  '''  private contextForDocument(document: Document): NoteContext | null {\n    const leaf = this.leafForDocument(document);\n    const candidate: unknown = (leaf?.view as { file?: unknown } | undefined)?.file;''',
                  '''  private fileForDocument(document: Document): TFile | null {\n    const leaf = this.leafForDocument(document);\n    const candidate: unknown = (leaf?.view as { file?: unknown } | undefined)?.file;\n    return candidate instanceof TFile ? candidate : null;\n  }\n\n  private contextForDocument(document: Document): NoteContext | null {\n    const candidate = this.fileForDocument(document);''',
              ),
              (
                  '''    if (!(candidate instanceof TFile)) {\n      return {''',
                  '''    if (!candidate) {\n      return {''',
              ),
              (
                  '''  private isActiveFile(file: TFile): boolean {\n    const documents = new Set<Document>([this.app.workspace.containerEl.ownerDocument]);\n    this.app.workspace.iterateAllLeaves((leaf) => documents.add(leaf.view.containerEl.ownerDocument));\n    for (const document of documents) {\n      if (this.contextForDocument(document)?.path === file.path) return true;\n    }\n    return false;\n  }''',
                  '''  private isActiveFile(file: TFile): boolean {\n    const documents = new Set<Document>([this.app.workspace.containerEl.ownerDocument]);\n    this.app.workspace.iterateAllLeaves((leaf) => documents.add(leaf.view.containerEl.ownerDocument));\n    for (const document of documents) {\n      if (this.fileForDocument(document)?.path === file.path) return true;\n    }\n    return false;\n  }''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one patch target, found {count}: {old[:100]!r}")
              source = source.replace(old, new)

          path.write_text(source)
          PY

          cat > tests/runtime-hotpath.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const source = fs.readFileSync(new URL("../src/main.ts", import.meta.url), "utf8");

          void test("metadata cache changes skip active-file work before layout is ready", () => {
            assert.match(
              source,
              /metadataCache\.on\("changed", \(file\) => \{\s*if \(!this\.layoutReady\) return;\s*if \(this\.isActiveFile\(file\)\)/,
            );
          });

          void test("active-file checks do not rebuild full note contexts", () => {
            assert.match(source, /private fileForDocument\(document: Document\): TFile \| null/);
            assert.match(
              source,
              /if \(this\.fileForDocument\(document\)\?\.path === file\.path\) return true;/,
            );
            const activeFileBody = source.match(
              /private isActiveFile\(file: TFile\): boolean \{([\s\S]*?)\n {2}\}/,
            )?.[1] || "";
            assert.doesNotMatch(activeFileBody, /contextForDocument/);
            assert.doesNotMatch(activeFileBody, /metadataCache/);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Verify optimization
        run: npm run check

      - name: Commit optimized hot paths
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm .github/workflows/optimize-runtime-hotpaths.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts tests/runtime-hotpath.test.ts .github/workflows/optimize-runtime-hotpaths.yml
          git commit -m "perf: scope runtime invalidation work"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:prerelease
