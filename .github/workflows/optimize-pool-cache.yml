name: Optimize Veil pool cache

on:
  push:
    branches:
      - prerelease
    paths:
      - ".github/workflows/optimize-pool-cache.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Patch pool cache invalidation
        shell: bash
        run: |
          cat > src/pool-cache-invalidation.ts <<'EOF'
          import { mediaKind } from "./settings";

          export type PoolCandidateVaultEvent = "create" | "delete" | "rename";

          function extensionFromPath(path: string): string {
            const name = path.slice(path.lastIndexOf("/") + 1);
            const separator = name.lastIndexOf(".");
            return separator > 0 && separator < name.length - 1 ? name.slice(separator + 1) : "";
          }

          export function wallpaperMediaPath(path: string): boolean {
            return Boolean(mediaKind({ extension: extensionFromPath(path) }));
          }

          export function shouldInvalidatePoolCandidates(
            event: PoolCandidateVaultEvent,
            path: string,
            oldPath = "",
            isFolder = false,
          ): boolean {
            if (isFolder) return event !== "create";
            if (event === "rename") {
              return wallpaperMediaPath(path) || wallpaperMediaPath(oldPath);
            }
            return wallpaperMediaPath(path);
          }
          EOF

          cat > tests/pool-cache-invalidation.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";
          import {
            shouldInvalidatePoolCandidates,
            wallpaperMediaPath,
          } from "../src/pool-cache-invalidation";

          void test("detects supported wallpaper media paths", () => {
            assert.equal(wallpaperMediaPath("Wallpapers/scene.PNG"), true);
            assert.equal(wallpaperMediaPath("Wallpapers/clip.webm"), true);
            assert.equal(wallpaperMediaPath("Notes/scene.md"), false);
            assert.equal(wallpaperMediaPath("Assets/manual.pdf"), false);
          });

          void test("ordinary file churn does not invalidate wallpaper pool candidates", () => {
            assert.equal(shouldInvalidatePoolCandidates("create", "Notes/new.md"), false);
            assert.equal(shouldInvalidatePoolCandidates("delete", "Notes/old.md"), false);
            assert.equal(
              shouldInvalidatePoolCandidates("rename", "Notes/new-name.md", "Notes/old-name.md"),
              false,
            );
          });

          void test("media changes invalidate wallpaper pool candidates", () => {
            assert.equal(shouldInvalidatePoolCandidates("create", "Wallpapers/new.webp"), true);
            assert.equal(shouldInvalidatePoolCandidates("delete", "Wallpapers/old.mp4"), true);
            assert.equal(
              shouldInvalidatePoolCandidates("rename", "Notes/converted.md", "Wallpapers/old.png"),
              true,
            );
            assert.equal(
              shouldInvalidatePoolCandidates("rename", "Wallpapers/converted.png", "Notes/old.md"),
              true,
            );
          });

          void test("folder topology only invalidates when it can remove or move candidates", () => {
            assert.equal(shouldInvalidatePoolCandidates("create", "Wallpapers/New", "", true), false);
            assert.equal(shouldInvalidatePoolCandidates("delete", "Wallpapers/Old", "", true), true);
            assert.equal(
              shouldInvalidatePoolCandidates("rename", "Wallpapers/New", "Wallpapers/Old", true),
              true,
            );
          });

          void test("vault handlers use selective pool cache invalidation", () => {
            const source = fs.readFileSync(new URL("../src/main.ts", import.meta.url), "utf8");
            for (const event of ["create", "delete", "rename"] as const) {
              assert.match(
                source,
                new RegExp(`shouldInvalidatePoolCandidates\\(\\"${event}\\"`),
              );
            }
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.ts")
          source = path.read_text()

          replacements = [
              (
                  'import { WallpaperSettingsTab } from "./settings-tab";',
                  'import { shouldInvalidatePoolCandidates } from "./pool-cache-invalidation";\nimport { WallpaperSettingsTab } from "./settings-tab";',
              ),
              (
                  '''      this.app.vault.on("create", (file) => {\n        this.poolCandidates.clear();\n        this.refreshIfWallpaper(file.path);\n      }),''',
                  '''      this.app.vault.on("create", (file) => {\n        if (shouldInvalidatePoolCandidates("create", file.path, "", !(file instanceof TFile))) {\n          this.poolCandidates.clear();\n        }\n        this.refreshIfWallpaper(file.path);\n      }),''',
              ),
              (
                  '''      this.app.vault.on("delete", (file) => {\n        this.poolCandidates.clear();\n        this.pruneWallpaperLibrary(file.path);\n        this.refreshIfWallpaper(file.path);\n      }),''',
                  '''      this.app.vault.on("delete", (file) => {\n        if (shouldInvalidatePoolCandidates("delete", file.path, "", !(file instanceof TFile))) {\n          this.poolCandidates.clear();\n        }\n        this.pruneWallpaperLibrary(file.path);\n        this.refreshIfWallpaper(file.path);\n      }),''',
              ),
              (
                  '''      this.app.vault.on("rename", (file, oldPath) => {\n        this.poolCandidates.clear();''',
                  '''      this.app.vault.on("rename", (file, oldPath) => {\n        if (shouldInvalidatePoolCandidates("rename", file.path, oldPath, !(file instanceof TFile))) {\n          this.poolCandidates.clear();\n        }''',
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one patch target, found {source.count(old)}: {old[:80]!r}")
              source = source.replace(old, new)

          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify optimization
        run: npm run check

      - name: Commit optimized implementation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm .github/workflows/optimize-pool-cache.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/pool-cache-invalidation.ts tests/pool-cache-invalidation.test.ts .github/workflows/optimize-pool-cache.yml
          git commit -m "perf: avoid unrelated wallpaper pool rescans"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:prerelease
