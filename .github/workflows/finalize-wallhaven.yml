name: Finalize Wallhaven integration

on:
  push:
    branches:
      - prerelease
    paths:
      - ".github/workflows/finalize-wallhaven.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Patch Wallhaven paging and responsive toolbar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/wallpaper-library-modal.ts")
          source = path.read_text()

          old_import = "  type WallhavenSearchMeta,\n  type WallhavenSorting,"
          new_import = "  type WallhavenSearchMeta,\n  type WallhavenSearchOptions,\n  type WallhavenSorting,"
          if source.count(old_import) != 1:
              raise SystemExit(f"Expected one WallhavenSearchOptions import target, found {source.count(old_import)}")
          source = source.replace(old_import, new_import)

          old_field = '  private wallhavenHasSearched = false;\n  private wallhavenQuery = "";'
          new_field = '  private wallhavenHasSearched = false;\n  private wallhavenLastSearch: WallhavenSearchOptions | null = null;\n  private wallhavenQuery = "";'
          if source.count(old_field) != 1:
              raise SystemExit(f"Expected one last-search field target, found {source.count(old_field)}")
          source = source.replace(old_field, new_field)

          start_marker = "  private async runWallhavenSearch(append: boolean): Promise<void> {"
          end_marker = "\n  private renderWallhavenGrid(): void {"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate Wallhaven search function boundaries")

          replacement = '''  private async runWallhavenSearch(append: boolean): Promise<void> {
            if (this.wallhavenBusy) return;
            const nextPage = append ? (this.wallhavenMeta?.currentPage || 0) + 1 : 1;
            const sorting = !this.wallhavenQuery.trim() && this.wallhavenSorting === "relevance"
              ? "date_added"
              : this.wallhavenSorting;
            const options: WallhavenSearchOptions = append && this.wallhavenLastSearch
              ? this.wallhavenLastSearch
              : {
                  query: this.wallhavenQuery,
                  categories: this.wallhavenCategories,
                  atleast: this.wallhavenAtleast,
                  ratios: this.wallhavenRatios,
                  sorting,
                };
            this.wallhavenBusy = true;
            if (this.wallhavenSearchButton) this.wallhavenSearchButton.disabled = true;
            if (this.summaryEl) {
              this.summaryEl.textContent = append
                ? "Loading more from Wallhaven…"
                : "Searching Wallhaven…";
            }

            try {
              const result = await searchWallhavenApi({ ...options, page: nextPage });
              if (append) {
                const known = new Set(this.wallhavenResults.map((wallpaper) => wallpaper.id));
                this.wallhavenResults.push(...result.data.filter((wallpaper) => !known.has(wallpaper.id)));
              } else {
                this.wallhavenResults = result.data;
              }
              this.wallhavenMeta = result.meta;
              this.wallhavenHasSearched = true;
              if (!append) this.wallhavenLastSearch = options;
            } catch (error) {
              new Notice(errorMessage(error));
            } finally {
              this.wallhavenBusy = false;
              if (this.wallhavenSearchButton) this.wallhavenSearchButton.disabled = false;
              this.renderWallhavenGrid();
            }
          }
          '''.replace("          ", "")
          source = source[:start] + replacement.rstrip() + source[end:]
          path.write_text(source)

          css_path = Path("styles.css")
          css = css_path.read_text()
          old_css = ".veil-wallpaper-library-toolbar {\n  display: flex;\n  gap: var(--size-4-2);"
          new_css = ".veil-wallpaper-library-toolbar {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--size-4-2);"
          if css.count(old_css) != 1:
              raise SystemExit(f"Expected one toolbar CSS patch target, found {css.count(old_css)}")
          css_path.write_text(css.replace(old_css, new_css))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify Wallhaven integration
        run: npm run check

      - name: Commit verified Wallhaven finalization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm .github/workflows/finalize-wallhaven.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wallpaper-library-modal.ts styles.css .github/workflows/finalize-wallhaven.yml
          git commit -m "fix: harden Wallhaven library state"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:prerelease
